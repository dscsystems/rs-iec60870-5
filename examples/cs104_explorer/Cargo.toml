[package]
name = "cs104-explorer"
version = "0.2.2"
edition = "2024"
publish = false

# A separate package from the library, so the terminal UI dependencies are
# never dependencies of rs-iec60870-5; it is a member of the root workspace.

[dependencies]
async-trait = "0.1.92"
chrono = "0.4.45"
crossterm = { version = "0.29.0", features = ["event-stream"] }
futures = "0.3.34"
rs-iec60870-5 = { version = "0.2.2", path = "../.." }
ratatui = "0.30.2"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "time", "sync", "signal"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["registry", "fmt"] }
